<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>procurement (mini-cdc-demo)</title>
<!--BASE_PATH-->
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
  th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
  th { background: #f4f4f4; }
  button { padding: 0.3rem 0.8rem; cursor: pointer; }
  h2 { margin-top: 2rem; }
  .note { color: #666; font-size: 0.85rem; }
  .pending { background: #fffbe6; }
</style>
</head>
<body>
<h1>procurement（調達側）</h1>
<p class="note">
  受信一覧は JDBC Sink Connector が Kafka から書き込んだ staging テーブル。
  Accept すると procurement.materials に反映される（取り込み承認）。
  <button onclick="reload()">再読込</button>
  <label><input type="checkbox" id="auto" checked> 5秒ごとに自動更新</label>
</p>

<h2>受信一覧（procurement.incoming_material_changes）</h2>
<table id="incoming"></table>

<h2>確定データ（procurement.materials）</h2>
<table id="materials"></table>

<script>
// server.js が BASE_PATH を注入する。ALB 経由では "/procurement"、ローカルでは ""。
const BASE = window.__BASE_PATH__ ?? '';
const api = (p) => `${BASE}${p}`;

function esc(v) {
  return String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

async function loadIncoming() {
  const rows = await (await fetch(api('/api/incoming-changes'))).json();
  document.getElementById('incoming').innerHTML =
    '<tr><th>change_id</th><th>material_code</th><th>proposed_name</th><th>proposed_qty</th><th>received_at</th><th>decision</th><th>decided_by</th><th></th></tr>' +
    rows.map((r) => `<tr class="${r.decision === 'pending' ? 'pending' : ''}">
      <td>${esc(r.change_id)}</td><td>${esc(r.material_code)}</td><td>${esc(r.proposed_material_name)}</td>
      <td>${esc(r.proposed_quantity)}</td><td>${esc(r.received_at)}</td><td>${esc(r.decision)}</td><td>${esc(r.decided_by)}</td>
      <td>${r.decision === 'pending' ? `
        <button onclick="decide(${r.change_id}, 'accept')">Accept</button>
        <button onclick="decide(${r.change_id}, 'decline')">Decline</button>` : ''}</td>
    </tr>`).join('');
}

async function loadMaterials() {
  const rows = await (await fetch(api('/api/materials'))).json();
  document.getElementById('materials').innerHTML =
    '<tr><th>material_code</th><th>material_name</th><th>quantity</th><th>updated_at</th></tr>' +
    rows.map((r) => `<tr><td>${esc(r.material_code)}</td><td>${esc(r.material_name)}</td><td>${esc(r.quantity)}</td><td>${esc(r.updated_at)}</td></tr>`).join('');
}

async function decide(id, action) {
  const decided_by = prompt(action === 'accept' ? '承認者名を入力' : '却下者名を入力');
  if (!decided_by) return;
  const res = await fetch(api(`/api/incoming-changes/${id}/${action}`), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ decided_by }),
  });
  if (!res.ok) {
    alert('失敗しました: ' + JSON.stringify(await res.json()));
    return;
  }
  await reload();
}

async function reload() {
  await Promise.all([loadIncoming(), loadMaterials()]);
}

// CDC の到着を待つ画面なので、既定でポーリングする。
setInterval(() => {
  if (document.getElementById('auto').checked) reload();
}, 5000);

reload();
</script>
</body>
</html>
