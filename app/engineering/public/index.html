<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>engineering (mini-cdc-demo)</title>
<!--BASE_PATH-->
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
  th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
  th { background: #f4f4f4; }
  form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
  input { padding: 0.3rem; }
  button { padding: 0.3rem 0.8rem; cursor: pointer; }
  h2 { margin-top: 2rem; }
  .note { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>engineering（設計側）</h1>
<p class="note">承認すると engineering.materials が UPDATE され、そこから CDC が発火する。</p>

<h2>資材一覧（engineering.materials）</h2>
<table id="materials"></table>

<h2>変更申請</h2>
<form id="request-form">
  <input name="material_code" placeholder="material_code (例: MAT-001)" required>
  <input name="new_material_name" placeholder="new material_name (任意)">
  <input name="new_quantity" type="number" step="0.01" placeholder="new quantity (任意)">
  <input name="requested_by" placeholder="requested_by" required>
  <button type="submit">申請</button>
</form>

<h2>申請一覧（engineering.material_change_requests）</h2>
<table id="requests"></table>

<script>
// server.js が BASE_PATH を注入する。ALB 経由では "/engineering"、ローカルでは ""。
const BASE = window.__BASE_PATH__ ?? '';
const api = (p) => `${BASE}${p}`;

function esc(v) {
  return String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

async function loadMaterials() {
  const rows = await (await fetch(api('/api/materials'))).json();
  document.getElementById('materials').innerHTML =
    '<tr><th>material_code</th><th>material_name</th><th>quantity</th><th>updated_at</th></tr>' +
    rows.map((r) => `<tr><td>${esc(r.material_code)}</td><td>${esc(r.material_name)}</td><td>${esc(r.quantity)}</td><td>${esc(r.updated_at)}</td></tr>`).join('');
}

async function loadRequests() {
  const rows = await (await fetch(api('/api/change-requests'))).json();
  document.getElementById('requests').innerHTML =
    '<tr><th>id</th><th>material_code</th><th>new_name</th><th>new_qty</th><th>status</th><th>requested_by</th><th>decided_by</th><th></th></tr>' +
    rows.map((r) => `<tr>
      <td>${esc(r.request_id)}</td><td>${esc(r.material_code)}</td><td>${esc(r.new_material_name)}</td>
      <td>${esc(r.new_quantity)}</td><td>${esc(r.status)}</td><td>${esc(r.requested_by)}</td><td>${esc(r.decided_by)}</td>
      <td>${r.status === 'submitted' ? `
        <button onclick="decide(${r.request_id}, 'approve')">承認</button>
        <button onclick="decide(${r.request_id}, 'reject')">却下</button>` : ''}</td>
    </tr>`).join('');
}

async function decide(id, action) {
  const decided_by = prompt(action === 'approve' ? '承認者名を入力' : '却下者名を入力');
  if (!decided_by) return;
  const res = await fetch(api(`/api/change-requests/${id}/${action}`), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ decided_by }),
  });
  if (!res.ok) {
    alert('失敗しました: ' + JSON.stringify(await res.json()));
    return;
  }
  await Promise.all([loadMaterials(), loadRequests()]);
}

document.getElementById('request-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const body = {
    material_code: form.get('material_code'),
    new_material_name: form.get('new_material_name') || undefined,
    new_quantity: form.get('new_quantity') ? Number(form.get('new_quantity')) : undefined,
    requested_by: form.get('requested_by'),
  };
  const res = await fetch(api('/api/change-requests'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    alert('申請に失敗しました: ' + JSON.stringify(await res.json()));
    return;
  }
  e.target.reset();
  await loadRequests();
});

loadMaterials();
loadRequests();
</script>
</body>
</html>
